<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Orders — Chez Professional Admin</title>
  <link rel="icon" href="/favicon.ico?v=4249fffb" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=cb1b552d">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=1056d844">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9d50453a">
  <link rel="stylesheet" href="admin.css?v=d56e0d52">
</head>
<body>
  <header class="admin-header">
    <h1>Orders</h1>
    <button type="button" class="button" data-logout hidden>Log out</button>
  </header>

  <p class="message" data-message hidden></p>

  <section class="login-screen" data-login-screen hidden>
    <div class="login-screen__brand">
      <img class="login-screen__logo" src="/assets/logo-756.png" alt="Chez Professional" width="378" height="178">
      <img class="login-screen__image" src="/assets/hero-banner.png?v=7d73bdc0" srcset="/assets/hero-banner.png?v=7d73bdc0 900w, /assets/hero-banner-1264.webp 1264w" sizes="580px" alt="">
    </div>

    <form class="login" data-login novalidate>
      <h1 class="login__title">Admin Login</h1>
      <label class="visually-hidden" for="admin-username">Username</label>
      <input class="login__input" id="admin-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" required>
      <div class="login__password">
        <label class="visually-hidden" for="admin-password">Password</label>
        <input class="login__input" id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button type="button" class="login__toggle" data-toggle-password aria-label="Show password" aria-pressed="false">
          <img src="/admin/icon-eye.svg" alt="" width="24" height="24">
        </button>
      </div>
      <p class="login__error" data-login-error role="alert" hidden></p>
      <button type="submit" class="login__submit">Sign In</button>
    </form>
  </section>

  <div data-app hidden>
    <nav class="tabs" aria-label="Order views">
      <button type="button" data-view="paid" aria-pressed="true">To ship</button>
      <button type="button" data-view="shipped" aria-pressed="false">Shipped</button>
      <button type="button" data-view="pending" aria-pressed="false">Awaiting payment</button>
      <button type="button" data-view="all" aria-pressed="false">All</button>
    </nav>

    <div class="toolbar">
      <label class="toolbar__select"><input type="checkbox" data-select-all> Select all</label>
      <button type="button" class="button button--primary" data-print disabled>Print A5 labels</button>
    </div>

    <ul class="orders" data-orders></ul>
  </div>

  <!-- Filled just before printing; only this part is printed -->
  <div class="labels" data-labels aria-hidden="true"></div>

  <script src="admin.js?v=49ebcc00"></script>
</body>
</html>
